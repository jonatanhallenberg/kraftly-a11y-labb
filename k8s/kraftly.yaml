# Kraftly Mina sidor i Kubernetes – stretchövningen i vecka 6.
# Tre objekt i en fil: ConfigMap (publik konfiguration), Secret (nyckeln) och
# Deployment (tre kopior av samma image) + Service (en adress framför dem).
#
#   kubectl apply -f k8s/kraftly.yaml
#   kubectl get pods -w
#   kubectl port-forward service/kraftly 8080:80   →  http://localhost:8080
#
# Byt <bild> mot er egen image i GHCR (paketet måste vara publikt).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kraftly-config
data:
  PORT: "80"
  APP_ENV: "kubernetes"
  FEATURE_NORWAY: "true"
  API_URL: "https://kraftly-api-staging.onrender.com" # test-API:t, utan snedstreck sist
---
apiVersion: v1
kind: Secret
metadata:
  name: kraftly-secrets
type: Opaque
stringData:
  API_KEY: "byt-mig" # kubectl create secret generic … är det riktiga sättet; här för att labben ska gå att köra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraftly
spec:
  replicas: 3 # tre kopior – Kubernetes håller det antalet, vad som än händer med en enskild pod
  selector:
    matchLabels:
      app: kraftly
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # byt ut en i taget, aldrig färre än tre som svarar
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kraftly
    spec:
      containers:
        - name: web
          image: ghcr.io/<ert-github-namn>/kraftly-cd-<namn>:main # <bild>
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: kraftly-config
            - secretRef:
                name: kraftly-secrets
          # Samma fråga som pipelinen ställer: svarar den? Först då får den trafik.
          readinessProbe:
            httpGet:
              path: /version.txt
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /version.txt
              port: 80
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kraftly
spec:
  selector:
    app: kraftly # trafiken går till alla pods med den här etiketten – lastbalansering på köpet
  ports:
    - port: 80
      targetPort: 80
