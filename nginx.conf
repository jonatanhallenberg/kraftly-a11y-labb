server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single page-app: okända adresser (/fakturor, /profil …) ska ge index.html
  # så att Vue Router kan ta över. Utan den här raden: 404 vid omladdning.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API-anrop skickas vidare till api-containern i Compose-nätverket (tjänstnamnet
  # 'api'). Appen anropar /api relativt – browsern pratar bara med den här servern.
  location /api/ {
    proxy_pass http://api:4000/api/;
  }
}
