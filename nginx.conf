server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single page-app: okända adresser (/fakturor, /profil …) ska ge index.html
  # så att Vue Router kan ta över. Utan den här raden: 404 vid omladdning.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Stretch (övning 1 B / M4): skicka API-anrop vidare till api-containern
  # i Compose-nätverket. Kräver att appen anropar /api relativt, inte localhost:4000.
  # location /api/ {
  #   proxy_pass http://api:4000/api/;
  # }
}
